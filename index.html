<!--
  [중요] 이 파일을 수정할 때마다 HANDOFF.md(인수인계서)를 함께 갱신할 것: 변경 이력 추가 + 바뀐 구조/기능 반영.
  - 이 파일은 React 18 + Tailwind 사전컴파일 CSS가 인라인된 '압축 번들'이다. 앱 코드는 두 번째 script 블록의 끝쪽(function Th, function kt, SettingsModal)에 압축된 채로 있다.
  - Tailwind는 컴파일된 일부 클래스만 들어 있다. 없는 클래스는 동작하지 않으니 id=ov 인 style 블록에 직접 CSS를 추가할 것.
  - 설정(테마/글꼴) 엔진은 id=settings-engine 인 script 블록, 색/글꼴 오버라이드는 id=ov 인 style 블록. 자세한 건 HANDOFF.md.
-->

:root{color-scheme:light}
html,body,#root{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:300;color:#000;background:#fff}
button{font-weight:400}
.md p{margin:.1rem 0}.md h1,.md h2,.md h3{font-weight:600;letter-spacing:-.02em;margin:.5rem 0 .2rem}.md h1{font-size:1.25rem}.md h2{font-size:1.1rem}
.md ul{padding-left:1.1rem;list-style:disc}.md li.cb{list-style:none;margin-left:-1.1rem;display:flex;gap:.5rem;align-items:flex-start}
.md input[type=checkbox]{margin-top:.3rem;accent-color:#000;width:15px;height:15px;flex:none}
.md code{background:#f4f4f4;padding:0 .25rem;font-size:.85em}.md pre{background:#f4f4f4;padding:.6rem;overflow-x:auto;font-size:.85em}
.md blockquote{border-left:2px solid #000;padding-left:.7rem;color:#444;margin:.2rem 0}.md hr{border-color:#E5E5E5;margin:.6rem 0}.md a{text-decoration:underline}
.md .dn{text-decoration:line-through;color:#9ca3af}
.inv,.inv *{color:#9ca3af!important;text-decoration:line-through}
.fade{animation:f .25s ease}.sl{animation:sl .25s ease}.sr{animation:sr .25s ease}
@keyframes f{from{opacity:0}}@keyframes sl{from{transform:translateX(30px);opacity:0}}@keyframes sr{from{transform:translateX(-30px);opacity:0}}
textarea,input,select{font:inherit;outline:none;background:transparent}
.pj{text-decoration:underline;cursor:pointer}.ed{scrollbar-width:none}.ed::-webkit-scrollbar{display:none}

.abs{white-space:nowrap;margin-left:.5rem}.ab{display:inline-block;color:#b3b3b3;cursor:pointer;padding:0 .22rem;font-size:11px;line-height:1;text-decoration:none}.ab:hover,.ab.on{color:#000}.ab.dl{color:#000;text-decoration:underline}.ab.tx{text-decoration:underline}
.inv .abs,.inv .abs *{text-decoration:none!important;color:#b3b3b3!important}
.abs{display:inline-flex;align-items:center;white-space:nowrap;margin-left:.3rem}.ab{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 .15rem;font-size:11px;line-height:1}.ab.f.on svg{fill:currentColor}
.flash{animation:fl 1.6s ease}@keyframes fl{from{background:#e8e8e8}to{background:transparent}}
.ab{min-width:18px;padding:0 .1rem}
.ab{min-width:15px;padding:0}.abs{margin-left:.25rem}.ab.dl{background:#000;color:#fff}.abs{margin-left:.15rem}
.ab{min-width:22px;height:22px}.abs{margin-left:.35rem}
.ab{min-width:21px}
@media(min-width:700px){.ab{min-width:30px;height:28px}.ab svg{width:16px;height:16px}.abs{margin-left:.6rem}}

<style id="ov">
/* ===== 테마/글꼴 오버라이드 (원본 CSS 뒤에 위치해야 함). 변수 정의는 head 스크립트가 #theme-vars 로 주입 ===== */
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--ff,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif);font-weight:var(--fw,300);letter-spacing:var(--ls,normal)}
button{font-weight:var(--fwb,400)}
*,:after,:before{border-color:var(--line)}
.bg-\[\#FBF8F1\]{background-color:var(--note)}
.bg-black{background-color:var(--acc)}
.bg-black\/20{background-color:var(--scrim)}
.bg-black\/80{background-color:rgba(var(--accrgb),.8)}
.bg-black\/\[\.06\]{background-color:var(--soft)}
.bg-white{background-color:var(--bg)}
.border-\[\#E5E5E5\]{border-color:var(--line)}
.border-black{border-color:var(--fg)}
.border-red-600{border-color:var(--danger)}
.border-l-black{border-left-color:var(--fg)}
.bg-black.border-black{border-color:var(--acc)}
.divide-\[\#E5E5E5\]>:not([hidden])~:not([hidden]){border-color:var(--line)}
.hover\:border-black:hover{border-color:var(--fg)}
.text-black{color:var(--fg)}
.text-neutral-400{color:var(--m4)}
.text-neutral-500{color:var(--m5)}
.text-neutral-600{color:var(--m3)}
.text-red-600{color:var(--danger)}
.text-white{color:var(--on)}
.caret-black{caret-color:var(--fg)}
.placeholder\:text-neutral-400::placeholder{color:var(--m4)}
input::placeholder,textarea::placeholder{color:var(--m4)}
.text-\[15px\]{font-size:var(--fs,15px)}
.leading-\[1\.5\]{line-height:var(--lh,1.5)}
.leading-relaxed{line-height:var(--lh,1.625)}
.md h1,.md h2,.md h3{font-weight:var(--fwh,600)}
.md code,.md pre{background:var(--code)}
.md blockquote{border-left-color:var(--fg);color:var(--bq)}
.md hr{border-color:var(--line)}
.md .dn{color:var(--inv)}
.md input[type=checkbox]{accent-color:var(--acc)}
.inv,.inv *{color:var(--inv)!important}

.ab.dl{background:var(--acc);color:var(--on)}
.inv .abs,.inv .abs *{color:var(--ab)!important}
@keyframes fl{from{background:var(--hl)}to{background:transparent}}

/* ===== 설정창 ===== */
.st-ov{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(.75rem,env(safe-area-inset-top)) .75rem max(.75rem,env(safe-area-inset-bottom))}

.st-themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.st-th{display:flex;flex-direction:column;gap:.4rem;padding:.4rem;border:1px solid var(--line);text-align:left;font-size:.8125rem}
.st-th.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.st-pv{display:flex;align-items:center;justify-content:space-between;height:2.25rem;padding:0 .55rem;border:1px solid rgba(128,128,128,.3);font-size:.8125rem}
.st-pv i{display:block;width:.8rem;height:.8rem;border-radius:9999px}
.st-auto{padding:0}
.st-auto div{flex:1;height:100%;display:flex;align-items:center;justify-content:center}
.st-sample{border:1px solid var(--line);padding:.75rem;margin-bottom:1.25rem;white-space:pre-wrap;font-size:var(--fs,15px);line-height:var(--lh,1.5)}
.st-fr{display:flex;align-items:center;justify-content:space-between;width:100%;padding:.55rem .15rem;border-bottom:1px solid var(--line);text-align:left;color:var(--m5);font-size:.9rem}
.st-fr.on{color:var(--fg)}
.st-fr em{font-style:normal;font-size:10px;margin-left:.5rem;padding:0 .3rem;border:1px solid var(--line);color:var(--m5)}
.st-in{width:100%;margin-top:.6rem;padding:.45rem .1rem;border-bottom:1px solid var(--line);font-size:.8125rem}
.st-in:focus{border-bottom-color:var(--fg)}
.st-rg{width:100%;accent-color:var(--acc)}
.st-mini{font-size:11px;text-decoration:underline;color:var(--m5)}
.st-reset{width:100%;padding:.45rem 0;font-size:.75rem;border:1px solid var(--line)}
.st-reset:hover{border-color:var(--fg)}
.st-pn button:focus-visible{outline:1px solid var(--fg);outline-offset:-2px}
