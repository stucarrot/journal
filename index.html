:root{color-scheme:light}
html,body,#root{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:300;color:#000;background:#fff}
button{font-weight:400}
.md p{margin:.1rem 0}.md h1,.md h2,.md h3{font-weight:600;letter-spacing:-.02em;margin:.5rem 0 .2rem}.md h1{font-size:1.25rem}.md h2{font-size:1.1rem}
.md ul{padding-left:1.1rem;list-style:disc}.md li.cb{list-style:none;margin-left:-1.1rem;display:flex;gap:.5rem;align-items:flex-start}
.md input[type=checkbox]{margin-top:.3rem;accent-color:#000;width:15px;height:15px;flex:none}
.md code{background:#f4f4f4;padding:0 .25rem;font-size:.85em}.md pre{background:#f4f4f4;padding:.6rem;overflow-x:auto;font-size:.85em}
.md blockquote{border-left:2px solid #000;padding-left:.7rem;color:#444;margin:.2rem 0}.md hr{border-color:#E5E5E5;margin:.6rem 0}.md a{text-decoration:underline}
.md .dn{text-decoration:line-through;color:#9ca3af}
.inv,.inv *{color:#9ca3af!important;text-decoration:line-through}
.fade{animation:f .25s ease}.sl{animation:sl .25s ease}.sr{animation:sr .25s ease}
@keyframes f{from{opacity:0}}@keyframes sl{from{transform:translateX(30px);opacity:0}}@keyframes sr{from{transform:translateX(-30px);opacity:0}}
textarea,input,select{font:inherit;outline:none;background:transparent}
.pj{text-decoration:underline;cursor:pointer}.ed{scrollbar-width:none}.ed::-webkit-scrollbar{display:none}

.abs{white-space:nowrap;margin-left:.5rem}.ab{display:inline-block;color:#b3b3b3;cursor:pointer;padding:0 .22rem;font-size:11px;line-height:1;text-decoration:none}.ab:hover,.ab.on{color:#000}.ab.dl{color:#000;text-decoration:underline}.ab.tx{text-decoration:underline}
.inv .abs,.inv .abs *{text-decoration:none!important;color:#b3b3b3!important}</style></head>
